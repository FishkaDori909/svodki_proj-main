# ============================================================
#  Значения, которые вписываются в сводку руками:
#  БП и «Коэффициент в расчёте» (вместе с датой).
#
#  Как пользоваться: скопируйте этот файл в config/manual_values.toml
#  и впишите свои значения. Строки с # — пояснения.
#
#  - Название слева в кавычках — это подпись строки из столбца B сводки.
#    Его не меняйте, меняйте только число справа от «=».
#  - Дробная часть — через ТОЧКУ: 0.67, а не 0,67.
#  - Дата — в кавычках, вида "01.06.2026".
#  - Строку можно удалить или закомментировать (# в начале) —
#    тогда в сводке останется значение из образца.
#  - Значения попадают на все листы дней. После сохранения файла
#    сводка пересоберётся сама (в режиме watch), перезапуск не нужен.
# ============================================================

