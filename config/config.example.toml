# ============================================================
#  Все настройки программы — в этом одном файле.
#  Как пользоваться: скопируйте его в config/config.toml
#  и поменяйте значения под себя. Строки с # — пояснения.
#  Пути можно писать от папки программы (data/inbox) или полностью.
# ============================================================

[paths]
inbox         = "data/inbox"        # сюда кладутся файлы ПОНМ
results       = "data/results"      # сюда программа складывает готовые сводки
errors        = "data/errors"       # сюда уходят файлы, которые не удалось принять
state         = "data/state"        # служебные записи программы (не трогать)
log_file      = "logs/svodka.log"   # журнал работы
template_file = "templates/svodka_template.xlsx"   # образец сводки (не трогать)
manual_values = "config/manual_values.toml"      # БП и коэффициенты, которые вписываются руками

[watch]
interval_seconds = 60   # как часто проверять папку, секунд (не меньше 5)
keep_days        = 30   # через сколько дней удалять старые файлы; 0 — не удалять никогда

[build]
timezone        = "Asia/Yekaterinburg"   # часовой пояс, по которому определяется текущий день и время
template_sheet  = ""      # лист-образец для новых дней; пусто — выбирается сам
month           = 0       # 0 — не ограничивать; 1..12 — брать только этот месяц
year            = 0       # 0 — не ограничивать; иначе, например, 2026
fill_sms        = true    # заполнять листы data_sms и «смс»
detailed_report = false   # true — в журнал пишется подробный отчёт о пустых ячейках

[limits]
max_file_mb     = 50    # файлы ПОНМ больше этого размера не принимаются
max_unpacked_mb = 500   # защита от «раздутых» файлов: размер содержимого после распаковки

# ---------- Приём файлов из почты ----------
[mail_in]
enabled         = false   # true — забирать вложения из почтового ящика
mbox_path       = ""      # путь к файлу (или папке) почтового ящика в формате mbox
restrict_senders = true   # true — принимать вложения только от отправителей из списка ниже;
                          # false — принимать от любых отправителей (список не нужен)
# Используется, когда restrict_senders = true.
# Можно писать адреса целиком или весь домен: "@company.ru"
allowed_senders = []

# ---------- Отправка готовой сводки ----------
[mail_out]
enabled           = false   # true — отправлять каждую готовую сводку письмом
from              = ""      # от чьего имени отправлять, например "svodka@company.ru"
to                = []      # кому отправлять, например ["a@company.ru", "b@company.ru"]
reply_to_sender   = false   # true — отправлять копию тому, кто прислал файл ПОНМ
attach_pdf        = true    # прикладывать PDF: последний лист, диапазон B1:P108, одна страница (нужен LibreOffice)
max_attachment_mb = 10      # максимальный размер всех вложений в одном письме

[smtp]
server   = ""           # адрес почтового сервера, например "mail.company.ru"
port     = 587
security = "starttls"   # "starttls" (порт 587), "ssl" (порт 465) или "none" (только для локального сервера)
verify_certificate = true   # false — не проверять сертификат сервера (например, если в server указан IP);
                            # соединение остаётся зашифрованным, но подлинность сервера не проверяется
login    = ""
password = ""           # лучше оставить пустым и задать переменную SVODKA_SMTP_PASSWORD (см. README)
